# ==========================================
# CD Workflow - Build & Deploy Frontend to EC2
# ==========================================

name: "CD - Deploy Frontend to EC2"

on:
  push:
    branches: [prod/master_frontend]
  workflow_dispatch:

env:
  IMAGE_TAG: latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Frontend (EC2 + Docker)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/gamevault-frontend:${{ env.IMAGE_TAG }}
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/gamevault-frontend:latest
          cache-to: type=inline

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Frontend on EC2
        run: |
          ssh -i ~/.ssh/ec2_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            echo "Deploying frontend on EC2..."

            # --- Directory setup ---
            mkdir -p ~/gamevault-frontend
            cd ~/gamevault-frontend

            # --- Create docker-compose.yml ---
            echo "Creating docker-compose.yml..."
            cat > docker-compose.yml <<'COMPOSE'
version: '3.8'

services:
  gamevault-frontend:
    image: ${DOCKERHUB_USERNAME}/gamevault-frontend:${IMAGE_TAG}
    container_name: gamevault_frontend_cloud
    ports:
      - "3000:3000"
    restart: unless-stopped
  COMPOSE
  
  # --- Create .env file ---
  echo "Creating .env..."
  echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" > .env
  echo "IMAGE_TAG=latest" >> .env
  
  echo "Pulling and restarting frontend container..."
  sudo docker compose pull
  sudo docker compose down
  sudo docker compose up -d
  
  echo "Deployment complete!"
  sudo docker compose ps
  EOF

- name: Cleanup SSH key
  if: always()
  run: rm -f ~/.ssh/ec2_key
