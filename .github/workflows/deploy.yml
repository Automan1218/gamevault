name: Deploy Frontend to EC2

on:
  push:
    branches:
      - prod/master_cloud
  workflow_dispatch:

env:
  IMAGE_TAG: latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/frontend:latest
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/frontend:latest
          cache-to: type=inline

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          # 使用前端仓库的 secret 名称
          echo "${{ secrets.CLOUD_EC2_SSH_KEY }}" | tr -d '\r' > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          
          # 验证密钥格式
          if ! grep -q "BEGIN.*PRIVATE KEY" ~/.ssh/ec2_key; then
            echo "Error: Invalid SSH key format"
            exit 1
          fi
          
          # 添加 known_hosts
          ssh-keyscan -H ${{ secrets.CLOUD_EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Frontend on EC2
        run: |
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no ubuntu@${{ secrets.CLOUD_EC2_HOST }} << 'EOF'
            echo "🔄 Pulling latest frontend image..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/frontend:latest
          
            echo "🛑 Stopping old frontend container..."
            docker stop gamevault-frontend 2>/dev/null || true
            docker rm gamevault-frontend 2>/dev/null || true
          
            echo "🚀 Starting new frontend container..."
            docker run -d \
              --name gamevault-frontend \
              --restart unless-stopped \
              -p 3000:80 \
              -e NODE_ENV=production \
              ${{ secrets.DOCKER_USERNAME }}/frontend:latest
          
            echo "⏳ Waiting for frontend to start..."
            sleep 5
          
            echo "✅ Deployment complete!"
            docker ps | grep frontend
          EOF

      - name: Verify Deployment
        run: |
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no ubuntu@${{ secrets.CLOUD_EC2_HOST }} << 'EOF'
            echo "📊 Frontend Status:"
            docker ps --filter name=gamevault-frontend --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          
            echo ""
            echo "📝 Recent Logs:"
            docker logs --tail=20 gamevault-frontend
          EOF

      - name: Test Frontend Endpoint
        run: |
          echo "🧪 Testing frontend endpoint..."
          sleep 3
          curl -f http://${{ secrets.CLOUD_EC2_HOST }}:3000 || echo "⚠️ Frontend not responding yet"

      - name: Show Deployment Info
        if: success()
        run: |
          echo "## ✅ Frontend Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** Frontend (Separate Repo)" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ secrets.DOCKER_USERNAME }}/frontend:latest" >> $GITHUB_STEP_SUMMARY
          echo "**Container:** gamevault-frontend" >> $GITHUB_STEP_SUMMARY
          echo "**Port:** 3000" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Access URL:" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend:** http://${{ secrets.CLOUD_EC2_HOST }}:3000" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Backend APIs:" >> $GITHUB_STEP_SUMMARY
          echo "- **Gateway:** http://${{ secrets.CLOUD_EC2_HOST }}:8080" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/ec2_key