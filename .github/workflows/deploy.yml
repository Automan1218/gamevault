name: Deploy Frontend to EC2 (Docker Compose)

on:
  push:
    branches:
      - prod/master_cloud
  workflow_dispatch:

env:
  IMAGE_TAG: latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/frontend:latest
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/frontend:latest
          cache-to: type=inline

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CLOUD_EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H ${{ secrets.CLOUD_EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Frontend on EC2
        run: |
          ssh -i ~/.ssh/ec2_key ubuntu@${{ secrets.CLOUD_EC2_HOST }} << 'EOF'
            cd ~/gamevault-cloud
          
            echo "Pulling latest frontend image..."
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/frontend:latest
          
            echo "Stopping old frontend container..."
            sudo docker compose stop frontend || true
            sudo docker compose rm -f frontend || true
          
            echo "Starting frontend..."
            sudo docker compose up -d frontend
          
            echo "Waiting for frontend to start..."
            sleep 10
          
            echo "Deployment complete!"
            sudo docker compose ps
          EOF

      - name: Show Deployment Info
        run: |
          echo "## Frontend Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ secrets.DOCKER_USERNAME }}/frontend:latest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Access URL:" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend:** http://${{ secrets.CLOUD_EC2_HOST }}:3000" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend Gateway:** http://${{ secrets.CLOUD_EC2_HOST }}:8080" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/ec2_key